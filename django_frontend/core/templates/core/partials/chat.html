<div id="content-chat" class="tab-content hidden fade-in">
  <div class="max-w-7xl mx-auto px-6 py-8">

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5" style="height: calc(100vh - 180px); min-height: 580px;">

      <!-- ── Left: Upload panel ── -->
      <div class="lg:col-span-1 flex flex-col gap-3">

        <!-- Panel header — session state lives here, not a floating bar -->
        <div id="panel-header" class="rounded-xl px-4 py-3 flex items-center justify-between"
             style="background:var(--bg-card); border:1px solid var(--border);">
          <div class="flex items-center gap-2.5">
            <span id="session-status-dot" class="w-2 h-2 rounded-full bg-gray-600 inline-block flex-shrink-0"></span>
            <span id="session-status-label" class="text-xs font-medium" style="color:var(--muted2);">No session</span>
            <code id="session-id-display" class="hidden text-xs px-1.5 py-0.5 rounded" style="background:var(--bg-card2); color:var(--cyan);"></code>
          </div>
          <!-- hidden until session exists -->
          <div id="session-bar" class="hidden">
            <button onclick="Chat.resetSession()"
              class="text-xs px-2.5 py-1 rounded-lg transition flex items-center gap-1"
              style="background:var(--bg-card2); color:var(--muted2); border:1px solid var(--border);"
              onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--muted2)'">
              <i class="fas fa-plus text-xs"></i> New
            </button>
          </div>
        </div>

        <!-- Drop zone -->
        <div id="drop-zone"
             class="rounded-2xl flex flex-col items-center justify-center text-center cursor-pointer transition-all"
             style="border:2px dashed var(--border); background:var(--bg-card); padding:1.75rem; min-height:160px;"
             onclick="document.getElementById('file-input').click()"
             ondragover="Chat.onDragOver(event)"
             ondragleave="Chat.onDragLeave(event)"
             ondrop="Chat.onDrop(event)">
          <div class="w-12 h-12 rounded-xl cyan-dim flex items-center justify-center mb-3 transition-all">
            <i class="fas fa-cloud-upload-alt cyan-text text-xl"></i>
          </div>
          <p class="font-semibold text-white text-sm">Drop PDF here or click to upload</p>
          <p class="text-xs mt-1" style="color:var(--muted);">Multiple files · max 20 MB each</p>
          <input id="file-input" type="file" accept=".pdf" multiple class="hidden" onchange="Chat.onFileSelect(event)" />
        </div>

        <!-- Document list -->
        <div id="doc-list" class="flex flex-col gap-2 overflow-y-auto" style="max-height:220px;"></div>

        <!-- Tips — hidden until READY, revealed by JS -->
        <div id="tips-panel" class="hidden rounded-xl p-4 mt-auto" style="background:var(--bg-card2); border:1px solid var(--border);">
          <p class="text-xs font-semibold mb-2.5 flex items-center gap-1.5 cyan-text">
            <i class="fas fa-lightbulb"></i> Try asking
          </p>
          <div class="flex flex-col gap-1.5">
            <button onclick="Chat.fillQuestion('What is the interest rate on this loan?')"
              class="text-left text-xs px-3 py-2 rounded-lg transition"
              style="background:var(--bg-card); color:var(--muted2); border:1px solid var(--border);"
              onmouseover="this.style.color='var(--cyan)'; this.style.borderColor='var(--cyan-glow)'"
              onmouseout="this.style.color='var(--muted2)'; this.style.borderColor='var(--border)'">
              What is the interest rate?
            </button>
            <button onclick="Chat.fillQuestion('What is the total repayment amount over the full tenure?')"
              class="text-left text-xs px-3 py-2 rounded-lg transition"
              style="background:var(--bg-card); color:var(--muted2); border:1px solid var(--border);"
              onmouseover="this.style.color='var(--cyan)'; this.style.borderColor='var(--cyan-glow)'"
              onmouseout="this.style.color='var(--muted2)'; this.style.borderColor='var(--border)'">
              Total repayment over full tenure?
            </button>
            <button onclick="Chat.fillQuestion('Compare the applicant and co-applicant monthly income.')"
              class="text-left text-xs px-3 py-2 rounded-lg transition"
              style="background:var(--bg-card); color:var(--muted2); border:1px solid var(--border);"
              onmouseover="this.style.color='var(--cyan)'; this.style.borderColor='var(--cyan-glow)'"
              onmouseout="this.style.color='var(--muted2)'; this.style.borderColor='var(--border)'">
              Compare applicant incomes
            </button>
            <button onclick="Chat.fillQuestion('Give me a summary of this loan document.')"
              class="text-left text-xs px-3 py-2 rounded-lg transition"
              style="background:var(--bg-card); color:var(--muted2); border:1px solid var(--border);"
              onmouseover="this.style.color='var(--cyan)'; this.style.borderColor='var(--cyan-glow)'"
              onmouseout="this.style.color='var(--muted2)'; this.style.borderColor='var(--border)'">
              Summarise the document
            </button>
          </div>
        </div>

      </div>

      <!-- ── Right: Chat area ── -->
      <div class="lg:col-span-2 flex flex-col rounded-2xl overflow-hidden"
           style="background:var(--bg-card); border:1px solid var(--border);">

        <!-- Message thread -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-5 flex flex-col gap-4">

          <!-- Empty state -->
          <div id="empty-state" class="flex flex-col items-center justify-center h-full gap-8 py-12">
            <div class="text-center">
              <div class="w-14 h-14 rounded-2xl cyan-dim flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-file-invoice-dollar cyan-text text-xl"></i>
              </div>
              <p class="font-semibold text-white mb-1">No document loaded</p>
              <p class="text-xs" style="color:var(--muted);">Upload a PDF loan document on the left to get started.</p>
            </div>
            <!-- Step guide -->
            <div class="flex items-center gap-3 text-xs" style="color:var(--muted2);">
              <div class="flex items-center gap-2">
                <span class="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold" style="background:var(--cyan-dim); color:var(--cyan); border:1px solid var(--cyan-glow);">1</span>
                Upload PDF
              </div>
              <i class="fas fa-chevron-right" style="color:var(--border);"></i>
              <div class="flex items-center gap-2">
                <span class="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold" style="background:var(--bg-card2); color:var(--muted); border:1px solid var(--border);">2</span>
                Processing
              </div>
              <i class="fas fa-chevron-right" style="color:var(--border);"></i>
              <div class="flex items-center gap-2">
                <span class="w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold" style="background:var(--bg-card2); color:var(--muted); border:1px solid var(--border);">3</span>
                Ask anything
              </div>
            </div>
          </div>

        </div>

        <!-- Input bar -->
        <div style="border-top:1px solid var(--border);" class="p-4">
          <!-- ready hint — hidden until unlocked -->
          <div id="ready-hint" class="hidden mb-3 flex items-center gap-2 text-xs" style="color:#34D399;">
            <span class="w-1.5 h-1.5 rounded-full inline-block" style="background:#34D399;"></span>
            Document ready — ask your first question
          </div>
          <div class="flex items-end gap-3">
            <textarea id="question-input"
              placeholder="Upload a document to unlock the chat…"
              disabled
              rows="1"
              onkeydown="Chat.onKeyDown(event)"
              oninput="Chat.autoResize(this)"
              class="flex-1 rounded-xl px-4 py-3 text-sm resize-none transition outline-none"
              style="background:var(--bg-card2); border:1px solid var(--border); color:var(--text);
                     min-height:44px; max-height:120px; line-height:1.5; font-family:inherit;"
            ></textarea>
            <button id="send-btn"
              onclick="Chat.sendMessage()"
              disabled
              class="w-11 h-11 rounded-xl flex items-center justify-center transition flex-shrink-0"
              style="background:var(--border); color:var(--muted);">
              <i class="fas fa-paper-plane text-sm"></i>
            </button>
          </div>
          <p class="text-xs mt-2" style="color:var(--muted);">Shift+Enter for new line · Enter to send</p>
        </div>

      </div>
    </div>
  </div>
</div>
