name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy-react-ui:
    name: Instance 1 — React UI
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INSTANCE1_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/FinanceHQ
            bash deploy/deploy-react.sh

  deploy-fastapi:
    name: Instance 2 — FastAPI + MLflow
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INSTANCE2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/FinanceHQ
            bash deploy/deploy-fastapi.sh
