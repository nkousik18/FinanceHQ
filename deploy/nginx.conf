server {
    listen 80;
    server_name _;

    # FastAPI — strip /api prefix, SSE-safe (no buffering)
    location /api/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    # React SPA — serve static build, fall back to index.html for client-side routing
    location / {
        root /home/ubuntu/FinanceHQ/react_ui/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
